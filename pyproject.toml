[project]
name = "tpot-payload-server"
version = "0.1.0"
description = "Payload integration project for T-Pot and GreedyBear"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.1",
    "python-magic==0.4.27",
    "uvicorn==0.48.0",
]

[dependency-groups]
test = [
    "pytest==9.0.3",
    "httpx==0.28.1",
]
lint = [
    "ruff==0.15.14",
    "pre-commit==4.6.0",
]

[tool.ruff]
extend-exclude = [
    ".github",
    ".idea",
    ".vscode",
    ".venv",
    "venv",
]
include = ["*.py"]
indent-width = 4
line-length = 160
output-format = "full"
respect-gitignore = false
show-fixes = true
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with formatter
    "ISC001",  # Conflicts with formatter
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",     # Use of assert detected (standard in pytest)
    "PLR2004",  # Magic value used in comparison
]
"app/hasher.py" = [
    "S324",     # Probable use of insecure hash functions (used for malware identification)
]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
]
