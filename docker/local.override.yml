# --------------------------------------------------------------------------
# Local development override: builds the image from local source with live reload
# --------------------------------------------------------------------------
services:
  tpot-payload-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/greedybear-project/tpot-payload-server:test
    volumes:
      - ../app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
