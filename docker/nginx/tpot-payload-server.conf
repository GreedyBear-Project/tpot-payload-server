# --------------------------------------------------------------------------
# tpot-payload-server — NGINX Reverse Proxy Configuration
#
# Provides TLS termination for the payload server API.
# Reuses T-Pot's existing self-signed certificates.
# --------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # TLS settings — mirrors T-Pot's own NGINX hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/cert/nginx.crt;
    ssl_certificate_key /etc/nginx/cert/nginx.key;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains;";

    # Proxy to the payload server container
    location / {
        proxy_pass http://tpot-payload-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
