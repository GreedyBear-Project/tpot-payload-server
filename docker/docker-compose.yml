# --------------------------------------------------------------------------
# tpot-payload-server — Docker Compose
# Deploy alongside T-Pot on the same host.
# All honeypot data directories are mounted as READ-ONLY volumes.
# The container itself is marked read_only and runs with no-new-privileges.
# --------------------------------------------------------------------------

services:
  tpot-payload-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tpot-payload-server
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - API_KEY=${API_KEY:-}
      - DATA_BASE_DIR=/data
      - HONEYPOT_DIRS=${HONEYPOT_DIRS:-dionaea/binaries,cowrie/downloads,honeytrap/downloads,adbhoney/downloads}
    volumes:
      - ${TPOT_DATA_PATH:?TPOT_DATA_PATH must be set}/dionaea/binaries:/data/dionaea/binaries:ro
      - ${TPOT_DATA_PATH}/cowrie/downloads:/data/cowrie/downloads:ro
      - ${TPOT_DATA_PATH}/honeytrap/downloads:/data/honeytrap/downloads:ro
      - ${TPOT_DATA_PATH}/adbhoney/downloads:/data/adbhoney/downloads:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
