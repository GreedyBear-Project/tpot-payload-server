# --------------------------------------------------------------------------
# tpot-payload-server — Docker Compose
# Deploy alongside T-Pot on the same host.
# All honeypot data directories are mounted as READ-ONLY volumes.
# The container itself is marked read_only and runs with no-new-privileges.
# --------------------------------------------------------------------------

services:
  tpot-payload-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tpot-payload-server
    ports:
      - "${API_PORT:-64444}:8080"
    environment:
      - API_KEY=${API_KEY:-}
      - HONEYPOT_DIRS=${HONEYPOT_DIRS:-dionaea/binaries,cowrie/downloads,honeytrap/downloads,adbhoney/downloads}
    volumes:
      - ${TPOT_DATA_PATH:?TPOT_DATA_PATH must be set}/dionaea/binaries:/data/dionaea/binaries:ro
      - ${TPOT_DATA_PATH}/cowrie/downloads:/data/cowrie/downloads:ro
      - ${TPOT_DATA_PATH}/honeytrap/downloads:/data/honeytrap/downloads:ro
      - ${TPOT_DATA_PATH}/adbhoney/downloads:/data/adbhoney/downloads:ro
    group_add:
      # T-Pot owns everything under its data path as tpot:tpot (uid/gid 2000)
      - 2000
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  nginx-proxy:
    image: nginx:1.31.2-alpine
    container_name: tpot-payload-server-nginx
    ports:
      - "${PROXY_PORT:-64445}:443"
    volumes:
      - ./nginx/tpot-payload-server.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TPOT_DATA_PATH:?TPOT_DATA_PATH must be set}/nginx/cert/nginx.crt:/etc/nginx/cert/nginx.crt:ro
      - ${TPOT_DATA_PATH}/nginx/cert/nginx.key:/etc/nginx/cert/nginx.key:ro
    depends_on:
      tpot-payload-server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
